# ─────────────── 咏唱质检（计划书 §5.6 六项快检）───────────────
qa_checklist:
  - 三段式结构完整性: true（──『上下句』── + ——魔法《名》原样保留）
  - 对仗逻辑未被破坏: true（『世界（你）』『我』对照结构整组落库）
  - 间隔点号保留: true（守护者开场白 · 原样）
  - 魔法名双语一致性: true（magic_name_jp / magic_name_en 分字段）
  - 成长链连贯性: true（维度→次元之冬→次元决战演算三连）
  - 代价字段因果闭环: true（替代之光系列 cost/effect 成对）
