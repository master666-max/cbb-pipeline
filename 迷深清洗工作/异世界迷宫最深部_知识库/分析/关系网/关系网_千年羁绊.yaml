# web版 千年羁绊关系网（P6）
# ============================================================
# 依据：计划书 §八.5（群像关系网——千年羁绊不是好友/敌人二元，而是循环结构）
# 建议：图数据库（Neo4j）或嵌套 YAML 表达循环结构。本文件用嵌套 YAML 呈现核心闭环。
# ============================================================
schema_version: 1.0
edition: web

# ─────────────── 核心闭环（千年羁绊循环）───────────────
millennium_loop:
  - start: 涡波
    edge: "妹妹依存 → {type: 病态依存 note: 妹妹就是我的一切}"
    to: 相川阳滝
  - start: 相川阳滝
    edge: "千年镜像 → {type: 镜像宿主体 note: 水之理的盗窃者/可模仿次元决战演算}"
    to: 诺斯菲
  - start: 诺斯菲
    edge: "名义婚姻/千年求爱 → {type: 名义女儿/妻子 note: 千年前与涡波为夫妻}"
    to: 涡波
  # 闭合：涡波 → 阳滝 → 诺斯菲 → 涡波

# ─────────────── 救赎线 ───────────────
redemption_arc:
  - {from: 涡波, to: 拉丝缇娅拉, type: "救赎与被救赎/婚约对象", note: "千年前开始的爱恋；最终婚约"}
  - {from: 拉丝缇娅拉, to: 玛利亚, type: "挚友/同床夜聊", note: "第291话 圣女"}
  - {from: 玛利亚, to: 涡波, type: "镜像依存/恋慕", note: "同化火之理的盗窃者之力"}

# ─────────────── 镜面对照（身份隐藏/双生）───────────────
mirror_pairs:
  - {a: 涡波（始祖涡波）, b: 使徒西斯（缇亚）, type: "身份隐藏/立足主君-使徒", note: "缇亚=迪亚布罗·西斯；涡波化名基督·欧亚"}
  - {a: 缇娅拉（圣人）, b: 缇亚（使徒西斯）, type: "圣人/使徒共鸣体", note: "再诞共鸣魔法"}
  - {a: 阿尔缇, b: 玛莉亚, type: "火之理的传承", note: "玛莉亚继承其力量"}
  - {a: 涡波, b: 阳滝, type: "兄妹镜像/次元对阵", note: "阳滝亦能演算先谭且更精练"}

# ─────────────── 第二梯队关系 ───────────────
secondary_relations:
  - {from: 缇缇, to: 艾德, type: 双人共鸣, note: "缇缇&艾德《樱童乐土》型共鸣"}
  - {from: 莱纳, to: 涡波, type: 近卫/主从, note: "担任涡波近卫后转任大圣堂骑士"}
  - {from: 涡波, to: 莉帕, type: 师徒/战斗, note: "教授次元魔法；Torsion caster"}
  - {from: 玛利亚, to: 帕林库洛, type: 对战, note: "无世界奉还阵时可单独取胜"}
  - {from: 涡波, to: 诺文・阿雷亚斯, type: "对抗/地之理", note: "30层"}
  - {from: 法夫纳, to: 涡波, type: "对抗/血之理", note: "70层；血之池支配"}

# ─────────────── 理之盗窃者关系网（按层）───────────────
thief_web:
  - {layer: 0, thief: 涡波, theory: 次元之理, relation: "核心；others 之救赎目标"}
  - {layer: 60, thief: 诺斯菲, theory: 光之理, relation: "涡波名义妻/千年依恋"}
  - {layer: 100, thief: 阳滝, theory: 水之理, relation: "涡波之妹/镜像"}
  - {layer: 20, thief: 缇达, theory: 暗之理, relation: "涡波对抗/身份线"}
  - {layer: 70, thief: 法夫纳, theory: 血之理, relation: "对抗/血之池"}
  - {layer: 80, thief: 赛尔德拉, theory: 无之理, relation: "魔人龙/对抗"}
  - {layer: 90, thief: 诺伊, theory: 次元之理(上代), relation: "最古老理之盗窃者/'我主'称谓源"}
  - {layer: 120, thief: 西娅・勒迦希, theory: 暗之理, relation: "世界大决战守护者"}

bond_notes:
  - "涡波—诺斯菲—阳滝 的镜像三角是全书'千年羁绊网'主轴（计划书 §六.1）。"
  - "各理之盗窃者的守护者开场白/最终咏唱/辞世诗/留恋互链见 咏唱库_main.yaml 与 世界书_五模块.yaml。"
