# web版 世界书（P5）
# ============================================================
# 依据：计划书 §七（世界观维度提取——五大模块：实体—规则—阵营—地理—时间线）
# 特别：理的盗窃者按层逐位建档（0/10/20/30/50/60/66/70/80/90/100/110/120层），只与咏唱库互链
# 引文取自场景块语料（带 episode / block 来源）
# ============================================================
schema_version: 1.0
edition: web
scope: 04_web版 全部

# ─────────────── 模块一：核心设定（实体）───────────────
entities:
  - entry_name: 迷宫（异世界迷宫最深部）
    keywords: [迷宫, 最深部, 百层, 可许愿, 遗迹]
    definition: |
      千年前诞生于开拓大陆的巨大遗迹，可实现任何愿望的深层结构。
      以"数位阶层"构造：第零层~第一百二十层各由"理的盗窃者"镇守。
      攻略方式两种：战斗消灭守护者，或帮助其实现留恋。
    source_chapters: [web 第1~10章]
    related_entries: [理的盗窃者, 探索者]

  - entry_name: 理的盗窃者
    keywords: [理的盗窃者, 盗取理, 守护者, 试炼]
    definition: |
      镇守迷宫各十位数阶层的守护者，实力异常强大。每个理的盗窃者都从世界上
      盗取了某个特定的"理"。击败方式有两种：战斗消灭，或帮助其实现留恋。
      其最终咏唱/守护者开场白/辞世诗/留恋均伴随"试炼"（第十之试炼…第一百二十之试炼）。
    source_chapters: [全web章]
    related_entries: [逐层理的盗窃者（见下方 thief_by_layer）]

# ─────────────── 理の盗窃者 逐层档案（P5核心，与咏唱库互链）───────────────
thief_by_layer:
  - layer: 0    # 第零层 / 月之理(第506话自称集体"我们都是理的盗窃者"，主角涡波)
    thief: 涡波 / 相川涡波・基督・欧亚・瓦尔德弗茨亚茨・冯・沃克
    aliases: [基督·欧亚, 始祖涡波]
    theory: 次元之理（第506话作"月之理的盗窃者"；主体为次元之理的盗窃者）
    guardian_decl: "『我们就是第零层。月之理的盗窃者涡波的阶层。……作为『第零之试炼』』（第506话）"
    incarnation_chain: ["次元魔法《Dimension》","次元决战演算『先谭/前日谭/再谭』"]
    wish: 拯救全员（"我绝对要救你"）
    source: 第十章 第506话

  - layer: 10
    thief: 阿尔缇
    theory: 火之理
    guardian_decl: "「这里，这·烈·火·灼·烧·的·山·丘·便·是·第·十·层。火之理的盗窃者阿尔缇的阶层。……『第十之试练』。」（第二章）"
    inheritance: 阿尔缇消失后，第十层之力由玛莉亚继承
    source: 第二章 第五章-煉狱十层 / 第九章

  - layer: 20
    thief: 缇达 / 缇亚
    theory: 暗之理
    guardian_decl: "「这里……便是二十层。暗之理的盗窃者缇达的阶层。」（第一章）"
    source: 第一章 第四章-二十层阶处 / 第二章
    related: 使徒西斯（缇亚）在同一身份系

  - layer: 30
    thief: 诺文
    theory: 地之理
    guardian_decl: "「这·大·剧·场·船『瓦尔法拉』正·是·三·十·层！地之理的盗窃者诺文的阶层！……『第三十之试练』！」（第三章）"
    source: 第三章 第四章-鍊狱三十

  - layer: 50
    thief: 风之理的盗窃者（罗德）
    theory: 风之理
    guardian_decl: "第186话：'您是风之理的盗窃者，同时也是五十层的守护者'；六十六层里侧魔王城亦罗德/缇缇线"
    source: 第五章 第186话

  - layer: 60
    thief: 诺斯菲・弗茨亚茨
    theory: 光之理
    guardian_decl: "「——这·里，这·世·界·的『顶·点』便·是·六·十·层。『光之理的盗窃者』诺斯菲的阶层。……『第六十之试练』。」（第7-3章）"
    incarnation_chain: ["作为『代替』……集于我身（代价咏唱Relife·Northfield）","化为光之魔法（Nosfy）"]
    source: 第7-2章 第312话 / 第7-3章

  - layer: 66   # 里侧
    thief: 罗德 / 缇缇
    theory: 风之理（魔王城）
    guardian_decl: "第216话：作为风之理的盗窃者的罗德与光之理的诺斯菲"
    source: 第五章 第216话 / 第八章 第410话

  - layer: 70
    thief: 法夫纳（法夫纳尼尔 / 法夫纳・赫勒比勒夏因）
    theory: 血之理
    guardian_decl: "「——这里……就是七十层。『血之理的盗窃者』法夫纳尼尔的阶层。……『第七十之试炼』。」（第十章 第486话）"
    source: 第十章 第486话 / 第7-3章

  - layer: 80
    thief: 赛尔德拉・库因菲利翁（赛鲁多拉）
    theory: 无之理（另见地/龙魔人）
    guardian_decl: "「这里（・・），这（・）『次元的裂缝（・・・・・）』即是八十层……『无之理的盗窃者』赛尔德拉•库因菲利翁的阶层。」（第十章 第482话）"
    source: 第十章 第482话 / 第八章 第395话

  - layer: 90
    thief: 诺伊・爱丽・利伯法尔
    theory: 次元之理（上一代，"我主"/最古老的理之盗窃者）
    guardian_decl: "「这里、这个『世界』就是九十层。『次元之理的盗窃者』诺伊的阶层。……『第九十之试炼』。」（第十章 第509话）"
    source: 第7-2章 第293话 / 第十章

  - layer: 100
    thief: 相川阳滝
    theory: 水之理
    guardian_decl: "「这里……『最后一页』便是一百层，『水之理的盗窃者』阳滝的阶层。……『第百之试炼』。」（第八章 第412话）"
    source: 第八章 第412话

  - layer: 110
    thief: 玛莉亚
    theory: 火之理
    guardian_decl: "「这里（・・），这个第十层便是百十层……『火之理的盗窃者』玛莉亚的阶层。……『百十之试炼』。」（第九章 第457话）"
    source: 第九章 第457/458话

  - layer: 120
    thief: 西娅・勒迦希
    theory: 暗之理
    guardian_decl: "「这里，这个一百层便是一百二十层。『暗之理的盗窃者』西娅・勒迦希的阶层。……『第一百二十之试炼』。」（第十章 第498话）"
    source: 第十章 第498话

note: 另见属性称呼（星之理/木之理/冰之理/魂之理/月之理/神圣之理）散落各章，代表个别守护者或群像称谓；以实测上下文为准。


# ─────────────── 模块二：魔法/力量体系（规则）───────────────
rules:
  - entry_name: 魔法属性体系
    keywords: [火, 水, 土, 木, 风, 光, 暗, 次元, 星, 血, 无]
    definition: |
      火/水/土/木/风 + 稀有属性（光/暗/次元/星/血/无/月/冰/魂/神圣）。
      咏唱分普通与代价咏唱两轨；真正魔法/固有技为守护者层次解禁（觉醒理的盗窃者身份后）。
      魔法名多为"日文汉字（英文注音）"双语结构（如冬之异世界 Wintry・Dimension）。
    source: 全web章

  - entry_name: 素质值 / 技能面板
    keywords: [素质, 等级, Level, Status, 状态, 面板]
    definition: |
      角色以素质/等级/魔力值构成数值体系，状态栏（Status/状态）以可召唤的"面板"呈现。
      重复系统面板在本语料中占位为[面板略]，仅保留首次完整版。
      特殊规则："数值无法表现的数值"（精神力/运气/直觉/爱的力量）可打破数值差距（第7-1章第1093话语境）。
    source: 第一章 Status/状态面板 / 第7-1章

  - entry_name: 咏唱机制
    keywords: [咏唱, 代价咏唱, 真正魔法, 固有技, 魔法名]
    definition: |
      普通咏唱=短句+魔法名；代价咏唱=支付代价（魔力/记忆/寿命/器官/信仰）强化；真正魔法=三段式对仗+魔法名（守护者/理之盗窃者解禁）。
      详见咏唱库_main.yaml（七分类+成长链）。
    source: 咏唱库

  - entry_name: 质感/意识魔法（魔力冰结化等）
    keywords: [魔力冰结化, 并列思考, 感应, 旨意, 丝线/线]
    definition: 特殊次元/操纵类技巧（丝线=故事诱导/命运红线等）。

# ─────────────── 模块三：阵营/势力 ───────────────
factions:
  - entry_name: 迷宫联合国
    keywords: [联合国, 五国, 迷宫联合国]
    definition: |
      由五国共同构成：弗茨亚茨（最富饶/最悠久/领头）、瓦尔德（改）、劳拉维亚、艾尔多拉琉、古尔亚德。
      五国均无外墙，仅以『魔石线』为界，来者不拒地迎探索者。
    source: 第7-1章 第265/266话

  - entry_name: 公会"史诗探索者"
    keywords: [公会, 史诗探索者, 探索者]
    definition: 攻略迷宫的探索者所属公会；男主一行之名，分类为高等级公会。
    source: 第7-1章 第275/278话

  - entry_name: 莱文教 / 雷梵教 & 元老院
    keywords: [莱文教, 雷梵教, 元老院, 圣人]
    definition: |
      莱文教以圣人缇娅拉为信仰；雷梵教为后期译名（换译者体系）；元老院掩藏圣人遗言与真正历史、追逐不老不死。
    source: 第7-1章 第266/267话 / 第309话

  - entry_name: 大圣堂/天上的七骑士
    keywords: [大圣堂, 骑士团, 七骑士]
    definition: 弗茨亚茨信仰与大圣堂骑士系统（莱纳等）。

  - entry_name: 使徒（西斯/迪普拉库拉）
    keywords: [使徒, 使徒西斯, 我主]
    definition: 使徒群以"使徒西斯"带队，与千年前自制的魔法身体/信仰供给相关。

# ─────────────── 模块四：地理/层位 ───────────────
geography:
  - entry_name: 拜伦西斯大陆 / 开拓大陆
    keywords: [大陆, 开拓地]
    definition: 迷宫联合国所在大陆；分联合国/本土（佩艾希亚等地名散见）。

  - entry_name: 各层镇守点
    keywords: [阶层, 守护者镇守点, 瓦尔法拉, 魔王城]
    definition: |
      第10层阿尔缇山丘 / 20层联合国全境（缇达）/ 30层大剧场船瓦尔法拉 / 60层宝空（诺斯菲）/
      66层里侧魔王城 / 80层次元裂缝 / 100层最后一页（阳滝）。
      详解见 thief_by_layer。

  - entry_name: 弗茨亚茨/大圣都/大圣堂
    keywords: [弗茨亚茨, 大圣都, 大圣堂]
    definition: 联合国第一强国首都及其大圣堂；千年前与现在的重叠之地。

# ─────────────── 模块五：时间线 ───────────────
timeline:
  - entry_name: 千年前（境界战争 / 始祖时代）
    keywords: [千年前, 境界战争, 始祖涡波, 圣人缇娅拉]
    definition: |
      千年前涡波(始祖)与缇娅拉制定迷宫/莱文教/再诞计划；始祖涡波与诺斯菲为夫妻；
      使徒西斯/莱文教起源在此。"北""南"之分（诺斯菲为南之御旗、追捕逃往北方的始祖涡波）。
    source: 第7-2章 第283/305话 / 第7-1章

  - entry_name: 千年后（现代攻略）
    keywords: [现代, 攻略, 探索者]
    definition: 相川涡波转生/穿越至现代（第1层起命悬一线），一路攻略至8x->100+层。
    source: 全web章（第四章起第131话船旅篇）

  - entry_name: web 专属剧情（web_only 标注）
    keywords: [web_only, 超越于爱更胜生命, 新篇章]
    definition: |
      第8章"超越于爱,更胜生命"高潮段、第9-10章新篇章为web专属；
      抽取时加 edition: web_only（人工复核时逐段标注）。
    source: 第八章~第十章

  - entry_name: 新暦纪元（千年前后纪年）
    keywords: [新暦, 新年号]
    definition: 第八章后半以"新暦0005-0013年"纪年推进（第382-386话）。


# ─────────────── 补充（第7-1/7-2章 子代理复核）───────────────
chapter7_notes:
  - entry_name: 理之盗窃者持有者补全（第7-1/7-2章语境）
    definition: |
      第7章战斗中确认持有者对照：火之理=玛利亚（继承阿尔缇）、血之理=法芙纳、
      光之理=诺斯菲、木之理=艾德、风之理=缇缇、暗之理=艾德/缇达、次元之理=涡波/诺伊（两代）。
      魔石人类与理之盗窃者密不可分；理之盗窃者可携带记忆（如诺斯菲）或失忆（如涡波）。
    source: 第7-1/7-2章（子代理复核提取）
  - entry_name: 大圣都/弗茨亚茨城结构
    definition: |
      大圣都为世界最大都市（无外壁、以魔石线为界）；中央『弗茨亚茨城』由中央大塔+东西南北四塔
      构成约五十层级巨塔；塔顶为世界第一高地；元老院（五人制，雷琪女士为代表，追求不死）于最上层；
      大圣堂为莱文教中枢（拉丝缇娅拉为最高负责人）。
    source: 第7-1/7-2章
  - entry_name: 魔石人类补充
    definition: |
      宿有『圣人血』而才华横溢；诺斯菲是第一个魔石人类；联合国有一百多个魔石人类互称家人；
      特定魔石（理之盗窃者/使徒的魔石）为关键道具（艾德、缇缇的魔石为诺斯菲项链所持）。
    source: 第7-1/7-2章
